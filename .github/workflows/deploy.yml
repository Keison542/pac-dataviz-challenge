name: Deploy Next.js to GitHub Pages and InfinityFree

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # ==========================================
  # BUILD FOR GITHUB PAGES
  # ==========================================
  build-github:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Build for GitHub Pages
        run: npm run build

      - name: Verify GitHub Pages output
        run: |
          echo "GitHub Pages build:"
          ls -la
          test -d out
          ls -la out

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out


  # ==========================================
  # DEPLOY TO GITHUB PAGES
  # ==========================================
  deploy-github:
    needs: build-github
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  # ==========================================
  # BUILD FOR INFINITYFREE
  # ==========================================
  build-infinityfree:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for InfinityFree
        env:
          DEPLOY_TARGET: infinityfree
        run: npm run build

      - name: Verify InfinityFree output
        run: |
          echo "InfinityFree build:"
          ls -la
          test -d out
          ls -la out

      - name: Upload to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./out/
          server-dir: /htdocs/pac-dataviz/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
